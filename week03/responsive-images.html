<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Load</title>
    <meta name="description" content="Demonstrate responsive image sizing">
    <meta name="author" content="Charlton Castlemain">
    <link rel="stylesheet" href="styles/responsive-images.css">
</head>

<body>
    <header><h1>Responsive Image Demonstration</h1>
    </header> 
    <main>
        <div class="hero">
            <picture>
                <source src="images/hero-small.webp" media="(max-width: 500px)">
                <source src="images/hero-medium.webp" media="(max-width: 1000px)">
                <img src="images/hero-large.webp" alt="table setting" width="1500" height="750">
            </picture>
        </div>
    </main>
    <footer>&copy; Chartlon Castlemain | BYU-Idaho | WDD 230</footer>
</body>
</html>
